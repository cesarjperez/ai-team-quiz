<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario de IA por Niveles - Equipo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --success: #22c55e;
            --error: #ef4444;
            --border: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        p.subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        .level-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .level-btn {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            text-align: center;
        }
        .level-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
        }
        .level-btn.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .level-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        .quiz-container {
            display: none;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .option-btn {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 1rem 1.25rem;
            border-radius: 0.5rem;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
        }
        .option-btn.correct {
            background: rgba(34, 197, 94, 0.2);
            border-color: var(--success);
            color: #4ade80;
        }
        .option-btn.incorrect {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--error);
            color: #f87171;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
        }
        .btn-primary {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .results-container {
            display: none;
            text-align: center;
        }
        .results-container h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .results-container p {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        .score-badge {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Cuestionario de Conceptos de IA</h1>
            <p class="subtitle">Evaluación técnica por niveles para el equipo</p>
        </header>

        <!-- Selección de Niveles -->
        <div id="levelSelectView">
            <p style="margin-bottom: 1rem; font-weight: 500;">Selecciona un nivel para comenzar:</p>
            <div class="level-select" id="levelButtonsContainer"></div>
        </div>

        <!-- Vista del Quiz -->
        <div id="quizView" class="quiz-container">
            <div class="question-header">
                <span id="levelIndicator">Nivel 1</span>
                <span id="questionCounter">Pregunta 1 de 5</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <h3 class="question-text" id="questionText">Cargando pregunta...</h3>
            <div class="options-list" id="optionsList"></div>
            <div class="actions">
                <button id="nextBtn" class="btn-primary" disabled onclick="nextQuestion()">Siguiente</button>
            </div>
        </div>

        <!-- Vista de Resultados -->
        <div id="resultsView" class="results-container">
            <h2>¡Nivel Completado!</h2>
            <div class="score-badge" id="scoreBadge">5/5</div>
            <p id="resultsMessage">¡Excelente dominio de los conceptos!</p>
            <button class="btn-primary" onclick="returnToLevels()">Volver a los Niveles</button>
        </div>
    </div>

    <script>
        const quizData = {
            "title": "Cuestionario Avanzado de Conceptos de IA para Equipos",
            "levels": [
                {
                    "level": 1,
                    "title": "Nivel 1: Fundamentos y Arquitectura",
                    "description": "Conceptos esenciales sobre modelos, tokens y ventanas de contexto.",
                    "questions": [
                        {
                            "question": "¿Cuál es la definición técnica de un 'token' en un modelo de lenguaje grande (LLM)?",
                            "options": [
                                "Una palabra completa en inglés o español exclusivamente.",
                                "Un fragmento de palabra, palabra completa o signo de puntuación procesado como unidad básica.",
                                "Una clave criptográfica de seguridad para autenticar la API del modelo.",
                                "El costo monetario por cada mil consultas realizadas."
                            ],
                            "correct": 1
                        },
                        {
                            "question": "¿Qué representa la 'ventana de contexto' (context window) de una IA?",
                            "options": [
                                "El tiempo de respuesta en milisegundos desde que envías el prompt.",
                                "El límite máximo de tokens que el modelo puede retener y procesar simultáneamente.",
                                "La interfaz gráfica del chat donde escribes las instrucciones.",
                                "El historial de conversaciones guardadas en el navegador del usuario."
                            ],
                            "correct": 1
                        },
                        {
                            "question": "¿Qué función cumple el parámetro de 'temperatura' (temperature) en la generación de texto?",
                            "options": [
                                "Mide la temperatura de los servidores en la nube donde corre el modelo.",
                                "Controla la velocidad de procesamiento del hardware gráfico (GPU).",
                                "Regula el grado de aleatoriedad y creatividad en la selección de los tokens.",
                                "Determina el límite de caracteres permitidos por mensaje."
                            ],
                            "correct": 2
                        },
                        {
                            "question": "¿Qué es una 'alucinación' (hallucination) en los LLMs?",
                            "options": [
                                "Un error de red que desconecta la sesión del usuario.",
                                "La generación de información falsa o inventada presentada con total seguridad.",
                                "Cuando el modelo responde en un idioma extranjero por equivocación.",
                                "Una función secreta para activar modos de desarrollo."
                            ],
                            "correct": 1
                        },
                        {
                            "question": "¿Cuál es la principal ventaja de usar un prompt estructurado frente a una instrucción libre?",
                            "options": [
                                "Reduce automáticamente el consumo de energía eléctrica.",
                                "Permite guiar al modelo con mayor precisión, contexto y formato de salida deseado.",
                                "Elimina por completo la necesidad de usar tokens.",
                                "Hace que el modelo sea inmune a las alucinaciones."
                            ],
                            "correct": 1
                        }
                    ]
                },
                {
                    "level": 2,
                    "title": "Nivel 2: Conectividad y Protocolos (MCP)",
                    "description": "Model Context Protocol, integraciones y fuentes de datos externas.",
                    "questions": [
                        {
                            "question": "¿Qué significa la sigla MCP en el ecosistema de IA actual?",
                            "options": [
                                "Machine Control Program",
                                "Model Context Protocol",
                                "Multi-Core Processor",
                                "Maximum Context Pipeline"
                            ],
                            "correct": 1
                        },
                        {
                            "question": "¿Cuál es el propósito principal del protocolo MCP?",
                            "options": [
                                "Estandarizar la conexión segura y directa entre modelos de lenguaje y fuentes de datos o herramientas.",
                                "Comprimir los archivos de video en formato MP4 automáticamente.",
                                "Acelerar la velocidad de descarga de modelos de código abierto en GitHub.",
                                "Traducir código de Python a JavaScript de forma nativa."
                            ],
                            "correct": 0
                        },
                        {
                            "question": "En una arquitectura MCP, ¿qué papel juega el cliente (Client)?",
                            "options": [
                                "Es el servidor remoto que aloja los datos de la base de datos empresarial.",
                                "Es la aplicación de IA (como un chat o IDE) que inicia la conexión y solicita recursos al servidor MCP.",
                                "Es el usuario final que paga la suscripción mensual.",
                                "Es un archivo de configuración estático en formato JSON."
                            ],
                            "correct": 1
                        },
                        {
                            "question": "¿Qué tipo de recursos puede exponer un servidor MCP (MCP Server)?",
                            "options": [
                                "Bases de datos, archivos locales, APIs de servicios y herramientas de ejecución.",
                                "Únicamente imágenes en formato PNG y JPG.",
                                "Claves de cifrado RSA y certificados SSL.",
                                "Registros de transacciones bancarias físicas."
                            ],
                            "correct": 0
                        },
                        {
                            "question": "¿Por qué es revolucionario el MCP para los desarrolladores de agentes de IA?",
                            "options": [
                                "Porque reemplaza por completo la necesidad de usar Python.",
                                "Porque evita tener que crear integraciones personalizadas y frágiles para cada herramienta o fuente de datos.",
                                "Porque duplica la velocidad de los procesadores de los servidores.",
                                "Porque permite entrenar modelos desde cero en minutos."
                            ],
                            "correct": 1
                        }
                    ]
                },
                {
                    "level": 3,
                    "title": "Nivel 3: Skills y Automatización Modular",
                    "description": "Habilidades personalizadas, modularidad y flujos repetitivos.",
                    "questions": [
                        {
                            "question": "¿Cómo se define una 'skill' (habilidad) en el contexto de agentes y herramientas como Claude?",
                            "options": [
                                "Una certificación oficial emitida por OpenAI o Anthropic.",
                                "Un conjunto estructurado de instrucciones y recursos reutilizables para automatizar una tarea específica.",
                                "Un comando oculto para reiniciar los servidores.",
                                "Una librería de Python instalada mediante pip."
                            ],
                            "correct": 1
                        },
                        {
                            "question": "¿Cuál es la ventaja clave de encapsular flujos en una skill en lugar de reescribir prompts largos?",
                            "options": [
                                "Se evita repetir instrucciones complejas, asegurando consistencia y eficiencia operativa.",
                                "El modelo consume cero tokens al ejecutar una skill.",
                                "Permite que el modelo funcione sin conexión a internet.",
                                "Elimina la necesidad de usar archivos de configuración."
                            ],
                            "correct": 0
                        },
                        {
                            "question": "¿Qué elementos suelen componer una skill bien estructurada?",
                            "options": [
                                "Un archivo principal con instrucciones (SKILL.md) y opcionalmente scripts, ejemplos o referencias.",
                                "Únicamente una imagen de perfil y un nombre en código.",
                                "Una base de datos SQL completa integrada.",
                                "Un archivo ejecutable .exe para Windows."
                            ],
                            "correct": 0
                        },
                        {
                            "question": "¿Cómo se relaciona una skill con el concepto de modularidad en software?",
                            "options": [
                                "No tienen ninguna relación, la IA no sigue principios de software.",
                                "Permite aislar capacidades específicas para activarlas o actualizarlas de manera independiente sin afectar todo el sistema.",
                                "Obliga a reescribir todo el código fuente cada vez que se actualiza.",
                                "Hace que el programa sea monolítico y difícil de mantener."
                            ],
                            "correct": 1
                        },
                        {
                            "question": "¿Qué rol juegan los archivos de recursos auxiliares dentro de una skill?",
                            "options": [
                                "Proveer guías detalladas, scripts de apoyo o plantillas de datos que el agente consulta cuando lo necesita.",
                                "Ocupar espacio en disco innecesariamente.",
                                "Bloquear el acceso de usuarios no autorizados.",
                                "Hacer que el sistema operativo se vuelva más lento."
                            ],
                            "correct": 0
                        }
                    ]
                },
                {
                    "level": 4,
                    "title": "Nivel 4: RAG, Fine-Tuning y Recuperación",
                    "description": "Estrategias avanzadas de conocimiento y aumento de datos.",
                    "questions": [
                        {
                            "question": "¿Cuál es la diferencia fundamental entre RAG (Retrieval-Augmented Generation) y Fine-Tuning?",
                            "options": [
                                "RAG busca información externa en tiempo de ejecución sin modificar el modelo; Fine-Tuning ajusta los pesos internos del modelo.",
                                "RAG es solo para imágenes y Fine-Tuning es solo para texto.",
                                "Son exactamente el mismo proceso con diferentes nombres comerciales.",
                                "Fine-Tuning no requiere datos de entrenamiento, RAG sí."
                            ],
                            "correct": 0
                        },
                        {
                            "question": "¿Qué función cumple una base de datos vectorial (Vector Database) en un sistema RAG?",
                            "options": [
                                "Almacenar contraseñas de usuarios cifradas.",
                                "Guardar fragmentos de texto convertidos en vectores numéricos (embeddings) para buscar por similitud semántica.",
                                "Gestionar las hojas de cálculo de Excel de la empresa.",
                                "Renderizar gráficos en 3D para interfaces web."
                            ],
                            "correct": 1
                        },
                        {
                            "question": "¿En qué escenario es más recomendable aplicar RAG en lugar de Fine-Tuning?",
                            "options": [
                                "Cuando necesitas que el modelo responda basándose en documentos internos de la empresa que cambian constantemente.",
                                "Cuando quieres cambiar el tono de voz y estilo literario permanente del modelo.",
                                "Cuando el modelo no tiene conexión a internet y debe trabajar 100% offline.",
                                "Cuando el presupuesto es ilimitado y buscas la máxima complejidad."
                            ],
                            "correct": 0
                        },
                        {
                            "question": "¿Qué es un 'embedding' en el contexto de procesamiento de lenguaje natural?",
                            "options": [
                                "Un código de barras impreso en las etiquetas de los servidores.",
                                "Una representación numérica (vector) que captura el significado semántico de palabras o textos.",
                                "Un error crítico de compilación en Python.",
                                "Un plugin de navegador para traducir páginas."
                            ],
                            "correct": 1
                        },
                        {
                            "question": "¿Cuál es una limitación común de los sistemas RAG tradicionales?",
                            "options": [
                                "La pérdida de contexto global si el fragmento recuperado (chunk) está fuera de su contexto original.",
                                "Que no pueden leer archivos PDF bajo ninguna circunstancia.",
                                "Que eliminan por completo la ventana de contexto del LLM.",
                                "Que requieren obligatoriamente GPUs de gama alta en el equipo local."
                            ],
                            "correct": 0
                        }
                    ]
                },
                {
                    "level": 5,
                    "title": "Nivel 5: Agentes Autónomos y Tool Calling",
                    "description": "Sistemas avanzados, ejecución de funciones y flujos autónomos.",
                    "questions": [
                        {
                            "question": "¿Qué es el 'Tool Calling' (o Function Calling) en los modelos de lenguaje modernos?",
                            "options": [
                                "Una llamada telefónica automatizada realizada por la IA.",
                                "La capacidad del modelo para decidir cuándo y cómo invocar funciones externas estructuradas (APIs, calculadoras, código) para resolver una tarea.",
                                "Un comando de consola para instalar herramientas de desarrollo.",
                                "La interfaz donde el usuario selecciona los botones del chat."
                            ],
                            "correct": 1
                        },
                        {
                            "question": "¿Cómo se diferencia un Agente Autónomo de un flujo de prompt tradicional?",
                            "options": [
                                "El agente puede planificar, descomponer tareas complejas, usar herramientas y tomar decisiones iterativas sin intervención humana constante.",
                                "El agente funciona sin necesidad de electricidad.",
                                "El prompt tradicional es mucho más inteligente y rápido.",
                                "No hay diferencia, ambos son sinónimos exactos."
                            ],
                            "correct": 0
                        },
                        {
                            "question": "¿Qué es un bucle de razonamiento y acción (ciclo ReAct) en agentes de IA?",
                            "options": [
                                "Un ciclo donde el modelo piensa (Reason), actúa usando una herramienta (Act), observa el resultado (Observe) y repite hasta completar la tarea.",
                                "Un error de bucle infinito que congela la computadora.",
                                "Una técnica de animación gráfica para avatares virtuales.",
                                "Un protocolo de seguridad para evitar ataques cibernéticos."
                            ],
                            "correct": 0
                        },
                        {
                            "question": "¿Qué riesgo principal introduce otorgar capacidad de ejecución de código o llamadas a APIs a un agente autónomo?",
                            "options": [
                                "Que el monitor de la computadora cambie de color.",
                                "Problemas de seguridad, ejecución accidental de comandos destructivos o bucles de consumo excesivo de recursos si no está bien acotado.",
                                "Que el teclado deje de responder.",
                                "Reducción automática de la velocidad del internet."
                            ],
                            "correct": 1
                        },
                        {
                            "question": "En el diseño de arquitecturas de agentes, ¿qué es la orquestación (Orchestration)?",
                            "options": [
                                "La coordinación y gestión de múltiples agentes especializados, tareas, herramientas y flujos de datos para lograr un objetivo complejo.",
                                "La creación de música de fondo para los videos institucionales.",
                                "El almacenamiento físico de los discos duros en el rack.",
                                "La compilación de código en lenguajes de bajo nivel."
                            ],
                            "correct": 0
                        }
                    ]
                }
            ]
        };

        let currentLevelIndex = 0;
        let currentQuestionIndex = 0;
        let score = 0;
        let unlockedLevels = 1;
        let selectedOption = null;

        function initLevelSelect() {
            const container = document.getElementById('levelButtonsContainer');
            container.innerHTML = '';
            quizData.levels.forEach((lvl, idx) => {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                if (idx >= unlockedLevels) {
                    btn.classList.add('locked');
                    btn.disabled = true;
                }
                const titleParts = lvl.title.split(':');
                const subtitle = titleParts[1] ? titleParts[1].trim() : '';
                btn.innerHTML = `<strong>Nivel ${lvl.level}</strong><br><span style="font-size:0.75rem; font-weight:normal; color:var(--text-secondary);">${subtitle}</span>`;
                btn.onclick = () => startLevel(idx);
                container.appendChild(btn);
            });
        }

        function startLevel(index) {
            currentLevelIndex = index;
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('levelSelectView').style.display = 'none';
            document.getElementById('quizView').style.display = 'block';
            document.getElementById('resultsView').style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            selectedOption = null;
            document.getElementById('nextBtn').disabled = true;
            
            const level = quizData.levels[currentLevelIndex];
            const q = level.questions[currentQuestionIndex];

            document.getElementById('levelIndicator').innerText = level.title;
            document.getElementById('questionCounter').innerText = `Pregunta ${currentQuestionIndex + 1} de ${level.questions.length}`;
            
            const progress = ((currentQuestionIndex) / level.questions.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;

            document.getElementById('questionText').innerText = q.question;

            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const optBtn = document.createElement('button');
                optBtn.className = 'option-btn';
                optBtn.innerText = opt;
                optBtn.onclick = () => selectOption(idx, optBtn);
                optionsList.appendChild(optBtn);
            });
        }

        function selectOption(idx, btnElement) {
            if (selectedOption !== null) return;
            selectedOption = idx;

            const level = quizData.levels[currentLevelIndex];
            const q = level.questions[currentQuestionIndex];
            const buttons = document.querySelectorAll('.options-list .option-btn');

            buttons.forEach((b, i) => {
                b.disabled = true;
                if (i === q.correct) {
                    b.classList.add('correct');
                } else if (i === idx) {
                    b.classList.add('incorrect');
                }
            });

            if (idx === q.correct) {
                score++;
            }

            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            const level = quizData.levels[currentLevelIndex];
            currentQuestionIndex++;
            if (currentQuestionIndex < level.questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quizView').style.display = 'none';
            document.getElementById('resultsView').style.display = 'block';

            const level = quizData.levels[currentLevelIndex];
            const total = level.questions.length;
            document.getElementById('scoreBadge').innerText = `${score} / ${total}`;

            const msg = document.getElementById('resultsMessage');
            if (score === total) {
                msg.innerText = "¡Puntuación perfecta! Dominas este nivel por completo.";
                if (currentLevelIndex + 1 >= unlockedLevels && currentLevelIndex + 1 < quizData.levels.length) {
                    unlockedLevels = currentLevelIndex + 2;
                }
            } else if (score >= total * 0.6) {
                msg.innerText = "¡Buen trabajo! Has superado el nivel con éxito.";
                if (currentLevelIndex + 1 >= unlockedLevels && currentLevelIndex + 1 < quizData.levels.length) {
                    unlockedLevels = currentLevelIndex + 2;
                }
            } else {
                msg.innerText = "Sigue practicando los conceptos para dominar este nivel.";
            }
        }

        function returnToLevels() {
            initLevelSelect();
            document.getElementById('levelSelectView').style.display = 'block';
            document.getElementById('resultsView').style.display = 'none';
        }

        initLevelSelect();
    </script>
</body>
</html>
